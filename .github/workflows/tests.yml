name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build wheel and verify runtime assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Verify packaged web and splash assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")

          class StaticReferences(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get("src") if tag == "script" else attrs.get("href")
                  if value and value.startswith("/static/"):
                      self.paths.append("kaiagotchi/ui/web/static/" + value.removeprefix("/static/"))

          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              required = {
                  "kaiagotchi/ui/web/static/index.html",
                  "kaiagotchi/ui/web/static/css/cyberdeck.css",
                  "kaiagotchi/ui/web/static/js/app.js",
                  "kaiagotchi/ui/web/static/js/telemetry.js",
                  "kaiagotchi/ui/web/static/js/charts.js",
                  "kaiagotchi/ui/web/static/js/kaia/kaia-codec.js",
              }
              missing = required - names
              assert not missing, f"wheel is missing required web assets: {sorted(missing)}"

              index = archive.read("kaiagotchi/ui/web/static/index.html").decode("utf-8")
              refs = StaticReferences()
              refs.feed(index)
              missing_refs = sorted(set(refs.paths) - names)
              assert not missing_refs, f"index.html references missing wheel assets: {missing_refs}"

              splash = [n for n in names if n.endswith(".data/data/share/kaiagotchi/images/kaia.png")]
              assert splash, "wheel does not contain share/kaiagotchi/images/kaia.png"
          print(f"Verified {len(refs.paths)} static references and packaged splash image in {wheel.name}")
          PY

  quality-baseline:
    name: Compileall and static-analysis baseline (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Compile project and tests
        run: python -m compileall -q kaiagotchi tests

      - name: Record Ruff baseline (non-gating)
        id: ruff-baseline
        shell: bash
        run: |
          set +e
          python -m ruff check . --output-format=concise > ruff-report.txt 2>&1
          status=$?
          set -e
          findings=$(grep -Ec ':[0-9]+:[0-9]+: [A-Z]+' ruff-report.txt || true)
          {
            echo "### Ruff baseline (non-gating)"
            echo "- Command exit code: \`$status\`"
            echo "- Findings: \`$findings\`"
            if [ "$status" -eq 0 ]; then
              echo "- Result: clean."
            else
              echo "- Result: existing findings are reported, not hidden; see the uploaded full report."
              echo ""
              echo "First 30 report lines:"
              echo '\`\`\`text'
              head -n 30 ruff-report.txt
              echo '\`\`\`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "findings=$findings" >> "$GITHUB_OUTPUT"

      - name: Record mypy baseline (advisory)
        id: mypy-baseline
        shell: bash
        run: |
          set +e
          python -m mypy kaiagotchi > mypy-report.txt 2>&1
          status=$?
          set -e
          errors=$(grep -Ec ' error:' mypy-report.txt || true)
          {
            echo "### Mypy baseline (advisory)"
            echo "- Command exit code: \`$status\`"
            echo "- Error lines: \`$errors\`"
            if [ "$status" -eq 0 ]; then
              echo "- Result: clean."
            else
              echo "- Result: advisory findings are reported, not hidden; see the uploaded full report."
              echo ""
              echo "First 30 report lines:"
              echo ' \`\`\`text'
              head -n 30 mypy-report.txt
              echo ' \`\`\`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "errors=$errors" >> "$GITHUB_OUTPUT"

      - name: Upload static-analysis baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-baseline
          path: |
            ruff-report.txt
            mypy-report.txt
          if-no-files-found: warn
          retention-days: 14

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest
