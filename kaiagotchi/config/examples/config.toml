# =============================================================================
# Example Kaiagotchi system config
# =============================================================================
# Copy to /etc/kaiagotchi/config.toml (or point --config / KAIA_CONFIG at it)
# and override only the keys you need. Everything else falls back to the
# packaged defaults (kaiagotchi/config/defaults.toml).

[main]
name = "kaiagotchi"
# Primary/managed adapter for normal internet access. Do not put this into monitor mode.
iface = "wlan0"
# Dedicated Wi-Fi dongle for passive monitor-mode capture.
capture_iface = "wlan1"

# KAIAGOTCHI_INTERFACE overrides capture_iface at runtime.

[log]
level = "INFO"

# Capture uses the built-in passive airodump-ng path; PCAP archives are stored
# under kaiagotchi/storage/pcaps. No Bettercap backend is currently supported.

# Tune the emotional loop to taste:
# [personality]
# reward_alpha = 0.25
# threshold_happy = 0.25

# Enable a plugin you have dropped into the plugins directory:
# [plugins.my_plugin]
# enabled = true
