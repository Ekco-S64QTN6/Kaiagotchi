# =============================================================================
# Kaiagotchi — default configuration
# =============================================================================
# These defaults are merged with an optional system config at
# /etc/kaiagotchi/config.toml (or the path passed via --config / KAIA_CONFIG).
# Only override the keys you care about in your own config file.

[main]
# Display name for this instance.
name = "kaiagotchi"
# Wireless interface to use. Must support monitor mode + injection.
iface = "wlan0"

[log]
# Root log level: DEBUG, INFO, WARNING, ERROR, CRITICAL.
level = "INFO"

# -----------------------------------------------------------------------------
# Decision engine — cadence of the recon → targeting → maintenance state machine
# -----------------------------------------------------------------------------
# Seconds between decision cycles.
decision_cycle_delay = 5.0

# -----------------------------------------------------------------------------
# Personality — drives the reward → mood emotional loop
# -----------------------------------------------------------------------------
[personality]
default_mood = "neutral"
# Exponential smoothing factor applied to raw rewards (0-1, higher = snappier).
reward_alpha = 0.25
# Minimum seconds a mood must hold before it can change (anti-flicker).
min_mood_duration = 3.0
# Dead-band around thresholds to avoid oscillation.
mood_hysteresis = 0.1
# Seconds between emotional re-evaluations.
emotion_interval = 5.0

# Smoothed-reward thresholds that map to moods (ordered high → low).
threshold_excited = 0.60
threshold_happy = 0.25
threshold_curious = 0.05
threshold_bored = -0.05
threshold_frustrated = -0.25
threshold_sad = -0.60

# Epoch counts before drifting toward low-energy moods.
bored_num_epochs = 15
sad_num_epochs = 25
# Scales how strongly repeated encounters build "bond".
bond_encounters_factor = 20000

# Channels to hop across ([] = let the driver decide). Seconds spent per hop.
channels = []
hop_recon_time = 10

# -----------------------------------------------------------------------------
# Reward engine — weights for the signals that feed the mood loop
# -----------------------------------------------------------------------------
[reward]
# Passive reward decay applied per idle minute.
idle_decay_per_min = 0.02

[reward.weights]
handshakes = 0.50
ap_discovery = 0.10
station_discovery = 0.08
ap_growth = 0.05
channel_diversity = 0.03
activity = 0.05
idle_decay = -0.02
boredom = -0.05
sadness = -0.10

# -----------------------------------------------------------------------------
# Terminal UI
# -----------------------------------------------------------------------------
[ui]
# Target render rate for the curses dashboard.
fps = 2.0
# How many rows each dashboard pane shows.
max_visible_aps = 15
max_visible_stations = 10
max_visible_chatter = 6

[ui.faces]
neutral = "(◕‿‿◕)"
happy = "(•‿‿•)"
curious = "(◉_◉)"
bored = "(¬_¬)"
sad = "(╥☁╥ )"
frustrated = "(ಠ_ಠ)"
sleepy = "(≖‿‿≖)"
confident = "(⌐■_■)"
broken = "(☓‿‿☓)"

# -----------------------------------------------------------------------------
# Capture storage
# -----------------------------------------------------------------------------
[bettercap]
# Directory where captured handshakes / PCAPs are written.
handshakes = "/var/lib/kaiagotchi/handshakes"

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
# Each plugin is a subpackage of kaiagotchi.plugins. Add a section named after
# the plugin and set `enabled = false` to skip loading it. No plugins ship by
# default; drop your own into the plugins directory. See docs in the README.
# [plugins.my_plugin]
# enabled = true

# -----------------------------------------------------------------------------
# Cyber-Deck Web UI
# -----------------------------------------------------------------------------
[web]
enabled = true
host = "0.0.0.0"
port = 8080
update_hz = 10.0

