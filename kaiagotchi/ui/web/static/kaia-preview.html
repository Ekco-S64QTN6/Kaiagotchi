<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaia Codec Preview</title>
  <style>
    :root { --g: #4dff86; --gd: #1d6b3a; --bg: #020604; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--g); font: 13px 'JetBrains Mono', 'Share Tech Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
    h1 { font-size: 13px; letter-spacing: 4px; opacity: .8; }
    .codec { position: relative; width: min(920px, 100%); aspect-ratio: 16 / 10; border: 1px solid var(--gd); box-shadow: 0 0 24px rgba(77,255,134,.12) inset; }
    .codec canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .controls { width: min(920px, 100%); display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: transparent; color: var(--g); border: 1px solid var(--gd); padding: 6px 10px; font: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    button:hover, button.on { background: rgba(77,255,134,.12); border-color: var(--g); }
    input { flex: 1; min-width: 200px; background: transparent; border: 1px solid var(--gd); color: var(--g); padding: 6px 10px; font: inherit; }
    .row-label { width: 100%; opacity: .55; font-size: 11px; letter-spacing: 2px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>KAIA // CODEC PREVIEW</h1>
  <div class="codec" id="stage">
  </div>
  <div class="controls" id="moods"><div class="row-label">MOOD</div></div>
  <div class="controls">
    <div class="row-label">EVENTS</div>
    <button data-react="capture">Handshake capture</button>
    <button data-react="discovery">New AP</button>
    <button data-react="alert">Alert</button>
    <button id="cycle">Auto-cycle moods</button>
    <button id="link">Toggle link loss</button>
  </div>
  <div class="controls">
    <div class="row-label">SPEECH</div>
    <input id="line" value="Handshake captured. Passive capture logged.">
    <button id="say">Speak</button>
  </div>

  <script src="/static/js/kaia/kaia-shaders.js"></script>
  <script src="/static/js/kaia/kaia-renderer.js"></script>
  <script src="/static/js/kaia/kaia-animator.js"></script>
  <script src="/static/js/kaia/kaia-codec.js"></script>
  <script>
    (async () => {
      const qs = new URLSearchParams(location.search);
      const still = qs.has('still');
      const codec = await KaiaCodec.mount(document.getElementById('stage'), { still, portrait: qs.get('face') || undefined });
      if (qs.get('open')) codec.animator.forceOpen = parseFloat(qs.get('open'));
      if (qs.get('lid')) codec.animator.forceLid = parseFloat(qs.get('lid'));
      if (qs.get('pose')) codec.animator.forcePose = qs.get('pose').split(',').map(Number);
      window.codec = codec;
      if (qs.has('stats')) {
        const el = document.createElement('div');
        el.id = 'stats';
        el.style.cssText = 'position:fixed;top:8px;right:10px;font-size:11px;opacity:.8';
        document.body.appendChild(el);
        codec.profile((st) => {
          const gpu = st.gpu === null ? (st.gpuAvailable ? '…' : 'n/a') : st.gpu.toFixed(2);
          el.textContent = `${st.fps.toFixed(0)} fps · cpu ${st.cpu.toFixed(2)} ms · gpu ${gpu} ms`;
          const dbg = codec.renderer.gl.getExtension('WEBGL_debug_renderer_info');
          const gpuName = dbg ? codec.renderer.gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?';
          const c = codec.renderer.canvas;
          document.title = `${el.textContent} · ${c.width}x${c.height} · exposure ${codec.renderer.exposure.toFixed(2)} · ${gpuName}`;
        });
      }

      const box = document.getElementById('moods');
      const buttons = {};
      const pick = (m) => {
        codec.setMood(m);
        Object.values(buttons).forEach((b) => b.classList.toggle('on', b.dataset.mood === m));
      };
      KaiaAnimator.moods.forEach((m) => {
        const b = document.createElement('button');
        b.textContent = m;
        b.dataset.mood = m;
        b.onclick = () => pick(m);
        buttons[m] = b;
        box.appendChild(b);
      });
      pick(qs.get('mood') || 'neutral');
      // dev: ?react=capture / ?then=<mood> fire 1.5 s after load (for captures of transitions)
      if (qs.get('react')) setTimeout(() => codec.react(qs.get('react')), 1500);
      if (qs.get('then')) setTimeout(() => pick(qs.get('then')), 1500);

      document.querySelectorAll('[data-react]').forEach((b) => (b.onclick = () => codec.react(b.dataset.react)));
      const say = () => codec.speak(document.getElementById('line').value);
      document.getElementById('say').onclick = say;
      document.getElementById('line').onkeydown = (e) => e.key === 'Enter' && say();

      let timer = null;
      document.getElementById('cycle').onclick = (e) => {
        if (timer) { clearInterval(timer); timer = null; e.target.classList.remove('on'); return; }
        e.target.classList.add('on');
        let i = 0;
        timer = setInterval(() => pick(KaiaAnimator.moods[++i % KaiaAnimator.moods.length]), 3500);
      };
      let linkOk = true;
      document.getElementById('link').onclick = (e) => {
        linkOk = !linkOk;
        codec.setLink(linkOk);
        e.target.classList.toggle('on', !linkOk);
      };
      if (!still) setTimeout(() => codec.speak('Codec link established. Monitoring signals.'), 900);
    })();
  </script>
</body>
</html>
