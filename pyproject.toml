[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiagotchi"
version = "0.1.0"
description = "Kaiagotchi — autonomous, emotion-driven terminal agent for Wi-Fi reconnaissance research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
keywords = ["wifi", "reconnaissance", "security", "terminal", "agent", "curses"]

authors = [
    {name = "Michael Schellhorn"},
]
maintainers = [
    {name = "Ekco"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

# Runtime dependencies — only packages actually imported by the codebase.
dependencies = [
    "tomlkit",           # TOML configuration parsing/round-tripping
    "pydantic>=2.7.4",   # Typed SystemState / config models
    "scapy>=2.5.0",      # PCAP parsing, EAPOL/PMKID extraction
    "psutil>=5.9.0",     # Interface / system monitoring
    "rich>=13.0.0",      # Splash screen and progress rendering
    "aiohttp>=3.9.0",    # Cyber-Deck Web UI HTTP & WebSocket server
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-psutil",
    "types-requests",
]
# Optional runtime extras
splash = [
    "pillow>=10.0.0",    # Splash image → ASCII art conversion
]
net = [
    "requests>=2.32.3",  # Used by core/utils.py::download_file() (no current callers)
]

[project.urls]
Homepage = "https://github.com/Ekco-S64QTN6/Kaiagotchi"
"Bug Tracker" = "https://github.com/Ekco-S64QTN6/Kaiagotchi/issues"
Documentation = "https://github.com/Ekco-S64QTN6/Kaiagotchi#readme"

# `kaiagotchi` on the PATH runs the full agent (see kaiagotchi/cli.py).
[project.scripts]
kaiagotchi = "kaiagotchi.cli:run"

[tool.setuptools.packages.find]
include = ["kaiagotchi*"]
exclude = ["tests*", "docs*", "scripts*", "venv*", "backups*", "*.egg-info*", "build*", "dist*"]

[tool.setuptools.package-data]
kaiagotchi = [
    "config/*.toml",
    "config/examples/*.toml",
    "ui/web/static/**/*",  # Cyber-Deck frontend (HTML, CSS, JS, assets)
    "images/*",            # Splash screen assets
]

# ===== Code Quality & Formatting =====
[tool.black]
line-length = 88
target-version = ["py311", "py312"]
extend-exclude = '''
/(
  | \.eggs
  | \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["venv", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "B008",  # function calls in argument defaults
    "E501",  # line length (handled by black)
    "UP042", # str + Enum is intentional (pydantic-friendly serialization)
]

[tool.ruff.lint.isort]
known-first-party = ["kaiagotchi"]

# ===== Type Checking =====
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
# The codebase predates full annotation; type-checking is advisory, not strict.
# Tighten these incrementally as modules are annotated.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["scapy.*", "tomlkit.*"]
ignore_missing_imports = true

# ===== Testing =====
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "hardware: marks tests that require hardware",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
